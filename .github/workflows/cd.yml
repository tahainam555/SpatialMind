name: CD (Continuous Delivery)

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=v0.1.0-mid-eval
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Hook (Optional)
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -s -X POST "$RENDER_HOOK" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.1.0-mid-eval
          name: "SpatialMind v0.1.0 — Mid-Supervisory Evaluation Release"
          body: |
            ## SpatialMind — FYP-1 Mid-Supervisory Milestone Release
            
            This release delivers the functional core module of SpatialMind with an end-to-end live interface and automated CI/CD pipeline.
            
            ### Core Features Delivered:
            - **Agent 1 (Scene Understanding):** Natural language parsing with structured output validation (both Mock provider and Gemini provider ready).
            - **Agent 2 (Spatial Planning & Persistent Spatial Memory):** Multi-start deterministic constraint solver and rejected-pose tracking.
            - **Agent 3 (Scene Construction Contract):** Standalone `spatialmind.scene/v1` payload ready for Blender automation.
            - **Agent 4 (Verification & Refinement):** Geometric collision, room boundary, door swing, and clearance verification.
            - **Deterministic Workflow Controller:** Full loop (*Understand → Plan → Construct → Verify → Re-plan → Done*).
            - **Interactive 2D Visualizer UI:** Real-time top-down SVG rendering with cardinal wall orientation, door swing zones, and clearance feedback.
            - **Evaluation Fault Injection Mode:** Allows live demonstration of automatic error detection and self-repair.
            - **Automated CI/CD:** 62 automated unit tests across Python 3.10/3.11/3.12, strict typing with mypy, ruff linting, frontend build, and multi-stage Docker deployment to GHCR.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
